<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
:root{color-scheme:light;--ink:#162b30;--muted:#445d62;--paper:#f3f1e9;--white:#fffdf8;--line:#cdd3c8;--accent:#33467c;font:16px 'Segoe UI',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}main{max-width:1210px;margin:auto;padding:30px clamp(16px,4vw,56px) 36px}header{border-top:4px solid var(--accent);border-bottom:1px solid var(--line);padding:22px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,250px);align-items:end;gap:18px}h1{font:400 clamp(32px,5.2vw,60px)/1.06 Georgia,serif;letter-spacing:-.045em;margin:8px 0}h2{font-size:21px;margin:0 0 10px}p{margin:0}.eyebrow{font-weight:700;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-size:12px}.sub,.muted{color:var(--muted);line-height:1.5}.brief{font-size:17px;line-height:1.5;margin:17px 0}.select label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}select{background:var(--white);min-height:44px;width:100%;border:1px solid var(--muted);border-radius:4px;padding:6px 10px;color:inherit;font:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:16px}.kpi{background:var(--white);padding:13px 15px;min-width:0}.kpi strong{display:block;font:700 clamp(16px,2.25vw,28px)/1.18 'Segoe UI',Arial,sans-serif;letter-spacing:-.045em;color:var(--accent);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.kpi small{display:block;margin-top:5px;color:var(--muted);line-height:1.3}.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,365px),1fr));gap:14px}.chart{background:var(--white);border:1px solid var(--line);padding:15px;min-width:0}.chart h2{font-size:17px;margin-bottom:2px}.chart p{font-size:12px}.chart svg{display:block;width:100%;height:242px;margin:8px 0}.chart svg text{fill:var(--muted);font:11px 'Segoe UI',Arial,sans-serif}.gridline{stroke:var(--line);stroke-width:1}.baseline{stroke:var(--muted);stroke-width:1}.trace{fill:none;stroke:var(--accent);stroke-width:2.5}.mark{fill:var(--accent)}.mark.neg{fill:#9b423c}.bar{display:grid;grid-template-columns:minmax(110px,39%) 1fr auto;gap:7px;align-items:center;border-bottom:1px solid var(--line);padding:5px 0;font-size:13px}.bar span:first-child{overflow-wrap:anywhere}.bar strong{text-align:right;min-width:48px;font-variant-numeric:tabular-nums}.rail{height:9px;background:#ecece3;position:relative}.ink{height:100%;background:var(--accent);position:absolute}.ink.neg{background:#9b423c}.rails{margin:10px 0 13px}.notes{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;margin:23px 0}.notes li{margin:4px 0;line-height:1.5}.notes ul,.notes ol{padding-left:21px;margin:0 0 13px}.notes p{line-height:1.5}.action{background:var(--white);border-top:2px solid var(--accent);padding:13px 14px;margin-top:14px}.action b{display:block;font-size:13px;color:var(--accent);margin-bottom:4px}details summary{font-size:13px;cursor:pointer;padding:7px 0}table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}td,th{text-align:left;overflow-wrap:anywhere;padding:4px 6px;border-bottom:1px solid var(--line)}td:last-child,th:last-child{text-align:right}footer{border-top:1px solid var(--line);padding-top:10px;font-size:13px;line-height:1.55}a{color:var(--accent)}@media(max-width:650px){header,.notes{grid-template-columns:1fr;gap:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.chart{padding:11px}.chart svg{height:214px}}
</style></head>
<body><main><header><div><div class="eyebrow">Сессии магазина · SQL</div><h1>__TITLE__</h1><p class="sub">__SUBTITLE__</p></div><div class="select"><label for="segment">Срез отчёта</label><select id="segment"></select></div></header><p class="brief">__QUESTION__</p><noscript>Включите JavaScript для графиков. Выводы, методика и источники доступны ниже.</noscript><section class="kpis" id="kpis" aria-label="Показатели" aria-live="polite"></section><section class="charts" id="charts" aria-label="Графики"></section><div class="notes"><section><h2>Выводы</h2><ul>__FINDINGS__</ul><div class="action"><b>Следующий шаг</b><p>__ACTION__</p></div></section><section><h2>Как считали</h2><ol>__METHOD__</ol><details><summary>Ограничения и проверки</summary><ul>__LIMITS__</ul><ul>__CHECKS__</ul></details></section></div><footer>Источники: __SOURCES__</footer></main>
<script>
'use strict';
const D=__GROUPS__, byId=x=>document.getElementById(x), select=byId('segment'), ns='http://www.w3.org/2000/svg';
const num=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:3});
function el(parent,tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;parent.append(e);return e;}
function se(parent,tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;parent.append(e);return e;}
function bar(panel,rows){
  const box=el(panel,'div','rails'), lo=Math.min(0,...rows.map(r=>r.value)), hi=Math.max(0,...rows.map(r=>r.value));
  const range=hi-lo||1;
  for(const r of rows){const line=el(box,'div','bar');el(line,'span','',r.label);const rail=el(line,'div','rail');rail.setAttribute('aria-hidden','true');const part=el(rail,'div','ink'+(r.value<0?' neg':''));part.style.left=(100*(Math.min(r.value,0)-lo)/range)+'%';part.style.width=(100*Math.abs(r.value)/range)+'%';el(line,'strong','',num.format(r.value));}
}
function line(svg,rows){
  const w=svg.clientWidth,h=svg.clientHeight;if(w<100||h<40)return;
  const L=57,R=18,T=16,B=h-34, values=rows.map(r=>r.value),a=Math.min(...values),b=Math.max(...values),spread=b-a||Math.max(1,Math.abs(b)*.1),lo=a-spread*.12,hi=b+spread*.12;
  const xx=i=>L+(w-L-R)*i/Math.max(1,rows.length-1), yy=v=>B-(v-lo)*(B-T)/(hi-lo);
  svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=yy(v);se(svg,'line',{x1:L,x2:w-R,y1:y,y2:y,class:k===0?'baseline':'gridline'});se(svg,'text',{x:L-7,y:y+4,'text-anchor':'end'},new Intl.NumberFormat('ru-RU',{notation:'compact',maximumFractionDigits:1}).format(v));}
  if(rows.length>1)se(svg,'polyline',{points:rows.map((r,i)=>`${xx(i)},${yy(r.value)}`).join(' '),class:'trace'});
  const step=Math.max(1,Math.ceil(rows.length/(w<380?4:7)));
  rows.forEach((r,i)=>{const point=se(svg,'circle',{cx:xx(i),cy:yy(r.value),r:3.7,class:'mark'});se(point,'title',{},r.label+': '+num.format(r.value));if(i%step===0 && i<rows.length-step*.55 || i===rows.length-1)se(svg,'text',{x:i===rows.length-1?w-R:xx(i),y:h-11,'text-anchor':i===rows.length-1?'end':i===0?'start':'middle'},r.label);});
}
function table(panel,c){const d=el(panel,'details');el(d,'summary','','Значения (до 3 знаков)');const t=el(d,'table'),th=el(el(t,'thead'),'tr');el(th,'th','','Сегмент');el(th,'th','',c.unit);const body=el(t,'tbody');for(const r of c.rows){const tr=el(body,'tr');el(tr,'th','',r.label).scope='row';el(tr,'td','',num.format(r.value));}}
function render(){
  const g=D[Number(select.value)], k=byId('kpis'), graphs=byId('charts');k.replaceChildren();graphs.replaceChildren();
  for(const item of g.kpis){const b=el(k,'div','kpi');el(b,'strong','',item.value);el(b,'small','',item.label);}
  for(const c of g.charts){const p=el(graphs,'article','chart');el(p,'h2','',c.title);el(p,'p','muted',c.type==='line'?c.unit+' · шкала графика не от нуля':c.unit);if(c.type==='line'){const svg=se(p,'svg',{role:'img','aria-label':c.title});line(svg,c.rows);}else bar(p,c.rows);table(p,c);}
}
D.forEach((group, index) => select.add(new Option(group.name, String(index))));
select.addEventListener('change', render);
window.addEventListener('resize', () => {
  const charts = D[Number(select.value)].charts;
  byId('charts').querySelectorAll('.chart').forEach((panel, index) => {
    const svg = panel.querySelector('svg');
    if (svg) line(svg, charts[index].rows);
  });
});
render();
</script></body></html>
